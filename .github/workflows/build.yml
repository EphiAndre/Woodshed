# Costruisce Woodshed per Mac (Apple Silicon e Intel) e Windows sui computer di GitHub.
# Parte da solo a ogni modifica del codice, oppure a mano da Actions > "Costruisci Woodshed" > Run workflow.
# Le app finite si scaricano in fondo alla pagina dell'esecuzione, nella sezione Artifacts.

name: Costruisci Woodshed

on:
  push:
    branches: [main]
  workflow_dispatch:

# Se carichi più file di seguito, resta solo l'ultima costruzione (risparmia minuti)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: Woodshed-Mac-AppleSilicon
          - os: macos-15-intel
            name: Woodshed-Mac-Intel
          - os: windows-latest
            name: Woodshed-Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Costruisci l'app
        run: pyinstaller --noconfirm Woodshed.spec

      - name: Comprimi l'app (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Woodshed.app "${{ matrix.name }}.zip"

      - name: Comprimi l'app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Woodshed -DestinationPath "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          retention-days: 30
          compression-level: 0
